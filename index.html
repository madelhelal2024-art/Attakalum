<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلسلة الصوتية التفاعلية — صوت الألف</title>
<style>
:root{--blue:#217bb8;--ink:#23455e;--gold:#f3af47}*{box-sizing:border-box}body{margin:0;background:#eaf1f5;color:var(--ink);font-family:system-ui,Tahoma,sans-serif}header{background:#17354b;color:white;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header h1{margin:0;font-size:21px}button{font:inherit;border:1px solid #c8dbe6;padding:9px 15px;border-radius:11px;background:white;color:#17354b;cursor:pointer}button:hover,button:focus-visible{background:#e6f4fc;outline:2px solid #95c8e9}button.active,.primary{background:var(--blue);color:white;border-color:var(--blue)}nav,.bottom{background:white;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;padding:12px}.bottom{background:transparent}.stage{margin:14px auto;max-width:1500px;height:calc(100vh - 230px);min-height:400px;overflow:auto;background:#dbe8ed;border-radius:14px;display:flex;justify-content:safe center;align-items:flex-start;padding:16px;box-shadow:inset 0 3px 15px #17354b18}.pages{display:flex;direction:rtl;filter:drop-shadow(0 10px 15px #17354b22)}.page{width:var(--page-width);aspect-ratio:1476/2048;position:relative;flex:none;background:white}.page img{width:100%;height:100%;display:block}.area{position:absolute;border:2px solid transparent;background:transparent;padding:0;border-radius:10px}.area:hover,.area:focus-visible{border:2px dashed orange;background:#ffca451e}.note{font-size:13px;text-align:center;color:#567282;padding:6px}dialog{border:none;border-radius:18px;padding:0;width:min(95vw,1280px);max-height:95vh;box-shadow:0 20px 100px #071d38aa}dialog::backdrop{background:#081f3acc}.dialoghead{background:#17354b;color:white;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 18px;flex-wrap:wrap}.dialoghead h2{font-size:18px;margin:0}.inside{height:min(74vh,950px);overflow:auto;background:#f0f5f8;padding:16px;text-align:center}.activity{width:var(--act-width,100%);margin:auto;position:relative}.activity>img{width:100%;display:block}.dock{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:white}.choices{position:absolute;inset:0}.answer{position:absolute;width:7%;height:8%;background:transparent;border:2px solid transparent;border-radius:50%;padding:0}.answer.chosen{border:4px solid #f26b39;background:#ffc92522}.answer.right{border-color:#179267}.answer.wrong{border-color:#c62640}.sketch{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#status{font-weight:700;color:#326182}audio{max-width:100%;width:310px}#activityNav{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding-bottom:15px}@media(max-width:660px){header h1{font-size:16px}.stage{height:60vh;min-height:280px;padding:6px}nav button,.bottom button{padding:7px 9px;font-size:12px}.inside{height:70vh;padding:7px}audio{width:250px}}
</style></head><body>
<header><h1>📖 السلسلة الصوتية التفاعلية — الوحدة الأولى: صوت حرف الألف</h1><button onclick="document.documentElement.requestFullscreen?.()">⛶ ملء الشاشة</button></header>
<nav><button id="spread" class="active">▣ صفحتان</button><button id="single">▤ صفحة واحدة</button><button id="zin">＋ تكبير</button><span id="zoom">100%</span><button id="zout">− تصغير</button><button id="fit">ملاءمة</button></nav>
<main><div class="stage" id="stage"><div class="pages" id="pages"></div></div><div class="bottom"><button id="prev">→ السابق</button><span id="where">الصفحتان ٢٠ و٢١</span><button id="next">التالي ←</button></div><div id="activityNav"></div><p class="note">انقر على النشاط داخل صورة الصفحة أو على اسمه بالأسفل لتكبيره والاستماع والتفاعل معه.</p></main>
<dialog id="dialog"><div class="dialoghead"><h2 id="title"></h2><span><button id="plus">＋</button> <span id="activityZoom">100%</span> <button id="minus">−</button> <button id="close">✕ عودة للكتاب</button></span></div><div class="inside" id="inside"><div class="activity" id="activity"><img id="pic" alt="صورة النشاط الأصلية"><div class="choices" id="choices"></div><canvas class="sketch" id="sketch" hidden></canvas></div></div><div class="dock" id="dock"><audio id="audio" controls></audio><button id="check" hidden>✓ تحقق من الإجابات</button><button id="reset" hidden>↺ إعادة المحاولة</button><span id="status"></span></div></dialog>
<script>
const PAGES={20:'assets/page20.png',21:'assets/page21.png'};
const ACTIVITIES=[
{id:'a',title:'أ · أستمع وأكرر',page:20,rect:[12,16.5,78,29],image:'assets/act_a.png',audio:'assets/01-01-01-18A.mp3'},
{id:'b',title:'ب · أستمع وأشير وأكرر',page:20,rect:[12,50,78,41],image:'assets/act_b.png',audio:'assets/01-01-01-18B.mp3'},
{id:'c',title:'ج · ألاحظ وأتبع ثم أكتب وأنطق',page:21,rect:[12,13.5,77,23],image:'assets/act_c.png'},
{id:'d',title:'د · أستمع وأضع دائرة',page:21,rect:[12,37.4,78,33],image:'assets/act_d.png',audio:'assets/01-01-01-19D.MP3'},
{id:'h',title:'هـ · أستمع وأدندن',page:21,rect:[10,71.6,82,23],image:'assets/act_h.png',audio:'assets/01-01-01-19H.MP3'}
];
const $=id=>document.getElementById(id);let mode='spread',currentPage=20,zoom=1,actZoom=1,act=null,answers={},strokes=[],drawing=false;
function render(){const stage=$('stage'),width=mode==='spread'?Math.min(630,(innerWidth-68)/2):Math.min(660,innerWidth-45);$('pages').style.setProperty('--page-width',Math.max(165,Math.round(width*zoom))+'px');$('pages').replaceChildren();for(const n of(mode==='spread'?[20,21]:[currentPage])){const p=document.createElement('div');p.className='page';const im=document.createElement('img');im.src=PAGES[n];im.alt='الصفحة '+n;p.append(im);ACTIVITIES.filter(a=>a.page===n).forEach(a=>{const b=document.createElement('button');b.className='area';b.setAttribute('aria-label','افتح '+a.title);const [x,y,w,h]=a.rect;Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.onclick=()=>openActivity(a.id);p.append(b)});$('pages').append(p)}$('where').textContent=mode==='spread'?'الصفحتان ٢٠ و٢١':'الصفحة '+currentPage;$('zoom').textContent=Math.round(zoom*100)+'%';$('spread').classList.toggle('active',mode==='spread');$('single').classList.toggle('active',mode==='single');$('prev').disabled=mode==='spread'||currentPage===20;$('next').disabled=mode==='spread'||currentPage===21}
$('spread').onclick=()=>{mode='spread';render()};$('single').onclick=()=>{mode='single';render()};$('zin').onclick=()=>{zoom=Math.min(3,zoom+.25);render()};$('zout').onclick=()=>{zoom=Math.max(.5,zoom-.25);render()};$('fit').onclick=()=>{zoom=1;render()};$('prev').onclick=()=>{currentPage=20;render()};$('next').onclick=()=>{currentPage=21;render()};
for(const a of ACTIVITIES){const b=document.createElement('button');b.textContent=a.title;b.onclick=()=>openActivity(a.id);$('activityNav').append(b)}
function openActivity(id){act=ACTIVITIES.find(a=>a.id===id);actZoom=1;$('title').textContent=act.title;$('pic').src=act.image;$('status').textContent='';$('audio').hidden=!act.audio;$('audio').pause();$('audio').removeAttribute('src');if(act.audio)$('audio').src=act.audio;$('check').hidden=act.id!=='d';$('reset').hidden=!['c','d'].includes(act.id);$('sketch').hidden=act.id!=='c';$('choices').replaceChildren();if(act.id==='d')renderChoices();$('dialog').showModal();requestAnimationFrame(()=>{resizeActivity();if(act.id==='c')initCanvas()})}
function resizeActivity(){const area=$('inside').clientWidth-24;$('activity').style.setProperty('--act-width',Math.round(Math.min(1210,area)*actZoom)+'px');$('activityZoom').textContent=Math.round(actZoom*100)+'%';if(act?.id==='c')requestAnimationFrame(initCanvas)}
$('plus').onclick=()=>{actZoom=Math.min(3,actZoom+.25);resizeActivity()};$('minus').onclick=()=>{actZoom=Math.max(.5,actZoom-.25);resizeActivity()};$('close').onclick=()=>{$('audio').pause();$('dialog').close()};$('dialog').addEventListener('close',()=>{$('audio').pause()});
const coordinates={2:[41,31],3:[11.3,31],4:[72.3,75.8],5:[41.7,75.8],6:[11.5,75.8]},key={2:'sad',3:'happy',4:'happy',5:'sad',6:'happy'};
function renderChoices(){const layer=$('choices');layer.replaceChildren();for(const [q,[x,y]] of Object.entries(coordinates)){for(const face of ['happy','sad']){const b=document.createElement('button');b.className='answer'+(answers[q]===face?' chosen':'');b.setAttribute('aria-label',`السؤال ${q} ${face==='happy'?'وجه سعيد':'وجه حزين'}`);Object.assign(b.style,{left:(x-3.5)+'%',top:(y+(face==='sad'?9.3:0)-4)+'%'});b.onclick=()=>{answers[q]=face;renderChoices();$('status').textContent='تم حفظ الاختيار'};layer.append(b)}}}
$('check').onclick=()=>{let score=0;for(const [q,correct]of Object.entries(key))if(answers[q]===correct)score++;$('status').textContent=Object.keys(answers).length<5?'أكمل جميع الاختيارات الخمسة أولًا':'نتيجتك '+score+' / ٥';$('choices').querySelectorAll('.chosen').forEach(b=>{const a=b.getAttribute('aria-label');const q=Number(a.match(/\d+/)[0]);b.classList.add(a.includes(key[q]==='happy'?'سعيد':'حزين')?'right':'wrong')})};
$('reset').onclick=()=>{answers={};strokes=[];if(act.id==='d')renderChoices();if(act.id==='c')initCanvas();$('status').textContent='يمكنك البدء من جديد'};
function initCanvas(){const c=$('sketch');if(c.hidden)return;const r=c.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width*devicePixelRatio));c.height=Math.max(1,Math.round(r.height*devicePixelRatio));drawAll()}
function drawAll(){const c=$('sketch'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.lineWidth=Math.max(2,c.width*.004);ctx.strokeStyle='#215fae';ctx.lineCap='round';ctx.lineJoin='round';for(const stroke of strokes){ctx.beginPath();stroke.forEach(([x,y],i)=>i?ctx.lineTo(x*c.width,y*c.height):ctx.moveTo(x*c.width,y*c.height));ctx.stroke()}}
function point(e){const r=$('sketch').getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
$('sketch').addEventListener('pointerdown',e=>{drawing=true;strokes.push([point(e)]);e.currentTarget.setPointerCapture(e.pointerId);drawAll()});$('sketch').addEventListener('pointermove',e=>{if(drawing){strokes.at(-1).push(point(e));drawAll()}});['pointerup','pointercancel'].forEach(k=>$('sketch').addEventListener(k,()=>drawing=false));addEventListener('resize',()=>{render();if(act&&$('dialog').open)resizeActivity()});render();
</script></body></html>
